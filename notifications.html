<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesper: Activity & Notifications</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="canonical" href="https://vespersocial.org/notifications.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-pages.css">
</head>
<body class="app-shell">

  <!-- Top Glass Navigation Bar -->
  <header class="app-nav-bar">
    <div class="app-nav-inner">
      <a href="feed.html" class="app-brand" aria-label="Back to Feed">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" style="width:26px; height:26px;" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.5"/>
          <path d="M10 21L16 9L22 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="17" r="2.5" fill="var(--accent-primary)"/>
        </svg>
        <span>Vesper</span>
        <span class="app-brand-badge">Activity</span>
      </a>

      <div class="app-nav-actions">
        <a href="feed.html" class="nav-icon-btn" title="Feed"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
        <a href="explore.html" class="nav-icon-btn" title="Explore"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></a>
        <a href="messages.html" class="nav-icon-btn" title="Direct Messages"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>
        <a href="create.html" class="nav-icon-btn" title="Create Post" style="background:var(--accent-subtle); color:var(--accent-primary); border-color:var(--accent-border);"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
        <button id="themeToggleBtn" class="nav-icon-btn" title="Toggle Theme" type="button"><svg id="themeMoonIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
      </div>
    </div>
  </header>

  <!-- Notifications Content -->
  <main class="notifications-container">
    <div class="notifications-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-4);">
        <div>
          <h1 style="font-family:var(--font-display); font-size:1.5rem; font-weight:800; letter-spacing:-0.02em;">Activity & Alerts</h1>
          <p style="font-size:0.85rem; color:var(--text-secondary);">Direct chronological signals from members and circles you resonate with.</p>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="markAllReadBtn">Mark All Read</button>
      </div>

      <!-- Filter Tabs -->
      <div class="notif-filter-tabs" role="tablist">
        <button class="notif-tab active" data-filter="all" type="button">All Activity</button>
        <button class="notif-tab" data-filter="like" type="button">Likes</button>
        <button class="notif-tab" data-filter="comment" type="button">Comments</button>
        <button class="notif-tab" data-filter="follow" type="button">Follows</button>
        <button class="notif-tab" data-filter="circle" type="button">Circles</button>
      </div>

      <!-- List -->
      <div class="notif-list" id="notifList">
        <!-- Rendered by js/notifications.js -->
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Dock -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation">
    <a href="feed.html" class="dock-item" aria-label="Feed"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
    <a href="explore.html" class="dock-item" aria-label="Explore"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></a>
    <a href="create.html" class="dock-create-btn" aria-label="Create Post"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
    <a href="notifications.html" class="dock-item active" aria-label="Notifications"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
    <a href="profile.html" class="dock-item" aria-label="Profile"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
  </nav>

  <script src="js/db.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
