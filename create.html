<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesper: Creator Studio</title>
  <meta name="description" content="Upload high-resolution photography and apply authentic darkroom filter presets.">
  <link rel="canonical" href="https://vespersocial.org/create.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-pages.css">
</head>
<body class="app-shell">

  <!-- Top Glass Navigation Bar -->
  <header class="app-nav-bar">
    <div class="app-nav-inner">
      <a href="feed.html" class="app-brand" aria-label="Back to Feed">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" style="width:26px; height:26px;" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.5"/>
          <path d="M10 21L16 9L22 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="17" r="2.5" fill="var(--accent-primary)"/>
        </svg>
        <span>Vesper</span>
        <span class="app-brand-badge">Create Studio</span>
      </a>

      <div class="app-nav-actions">
        <a href="feed.html" class="btn btn-outline btn-sm">Cancel</a>
        <button id="themeToggleBtn" class="nav-icon-btn" title="Toggle Dark/Light Mode" type="button">
          <svg id="themeMoonIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Photo Creation Container -->
  <main class="create-container">
    <div class="create-glass-card">
      <div style="margin-bottom: var(--space-6); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--space-2);">
        <div>
          <h1 style="font-family:var(--font-display); font-size:1.6rem; font-weight:800; letter-spacing:-0.02em;">Publish New Photo</h1>
          <p style="font-size:0.88rem; color:var(--text-secondary);">Uploaded photos are preserved uncompressed on your sovereign profile and distributed chronologically.</p>
        </div>
        <div id="creatorPill" style="display:flex; align-items:center; gap:8px; background:var(--bg-secondary); padding:4px 12px; border-radius:var(--radius-full); border:1px solid var(--color-border); font-size:0.82rem;">
          <img id="creatorAvatar" src="" style="width:24px; height:24px; border-radius:50%; object-fit:cover;" alt="">
          <span id="creatorUsername" style="font-weight:700;">@username</span>
        </div>
      </div>

      <!-- Error / Alert Banner -->
      <div id="createAlert" style="display:none; padding:10px 14px; border-radius:var(--radius-md); font-size:0.85rem; margin-bottom:var(--space-4);"></div>

      <!-- Creation Form -->
      <form id="createPostForm" novalidate>
        <div class="create-grid">

          <!-- Left Column: Photo Upload & Filters -->
          <div>
            <!-- Dropzone -->
            <div class="dropzone-area" id="dropzoneArea" tabindex="0" role="button" aria-label="Upload photo from disk">
              <input type="file" id="photoFileInput" accept="image/*" style="display:none;">
              
              <div id="dropzonePrompt" style="display:flex; flex-direction:column; align-items:center;">
                <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <div style="font-weight:700; font-size:0.98rem; margin-bottom:4px;">Drag and drop photo here</div>
                <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:var(--space-3);">Supports JPG, PNG, WEBP (Uncompressed)</div>
                <button type="button" class="btn btn-outline btn-sm" id="browseFilesBtn">Browse from Computer</button>
              </div>

              <!-- Live Preview Image -->
              <img id="imagePreview" class="dropzone-preview-img" alt="Photo Preview">
            </div>

            <!-- Alternative: Paste Image URL or Use Sample -->
            <div style="margin-top: var(--space-3); display:flex; gap:var(--space-2);">
              <input type="url" id="photoUrlInput" class="form-input" placeholder="Or paste image URL..." style="height:36px; font-size:0.82rem;">
              <button type="button" class="btn btn-outline btn-sm" id="loadUrlBtn">Load</button>
            </div>

            <!-- Filter Presets Strip (Instagram-style) -->
            <div style="margin-top: var(--space-4);">
              <label style="font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); display:block; margin-bottom:var(--space-2);">
                Select Filter Preset
              </label>
              <div class="filter-presets-row" id="filterPresets">
                <button type="button" class="filter-preset-btn active" data-filter="filter-normal">
                  <div class="filter-thumbnail-preview filter-normal" style="background:#4A5568;"></div>
                  <span class="filter-preset-name">Normal</span>
                </button>
                <button type="button" class="filter-preset-btn" data-filter="filter-clarendon">
                  <div class="filter-thumbnail-preview filter-clarendon" style="background:#2B6CB0;"></div>
                  <span class="filter-preset-name">Clarendon</span>
                </button>
                <button type="button" class="filter-preset-btn" data-filter="filter-warm">
                  <div class="filter-thumbnail-preview filter-warm" style="background:#DD6B20;"></div>
                  <span class="filter-preset-name">Warmth</span>
                </button>
                <button type="button" class="filter-preset-btn" data-filter="filter-vintage">
                  <div class="filter-thumbnail-preview filter-vintage" style="background:#B7791F;"></div>
                  <span class="filter-preset-name">Vintage</span>
                </button>
                <button type="button" class="filter-preset-btn" data-filter="filter-clarity">
                  <div class="filter-thumbnail-preview filter-clarity" style="background:#319795;"></div>
                  <span class="filter-preset-name">Clarity</span>
                </button>
                <button type="button" class="filter-preset-btn" data-filter="filter-cool">
                  <div class="filter-thumbnail-preview filter-cool" style="background:#3182CE;"></div>
                  <span class="filter-preset-name">Cool Mist</span>
                </button>
                <button type="button" class="filter-preset-btn" data-filter="filter-noir">
                  <div class="filter-thumbnail-preview filter-noir" style="background:#1A202C;"></div>
                  <span class="filter-preset-name">Noir</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Right Column: Details, Caption, Tags -->
          <div class="create-details-col">
            <!-- Caption -->
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--space-1);">
                <label class="auth-label" for="postCaption" style="margin-bottom:0;">Caption & Reflections</label>
                <span id="captionCharCount" style="font-size:0.75rem; color:var(--text-muted);">0 / 500</span>
              </div>
              <textarea id="postCaption" class="create-textarea" placeholder="Write a thoughtful caption... Use #hashtags to categorize into discovery vectors." maxlength="500"></textarea>
            </div>

            <!-- Sovereign Circle Category -->
            <div>
              <label class="auth-label" for="postCircle">Sovereign Circle</label>
              <select id="postCircle" class="form-input" style="height:42px; cursor:pointer;">
                <option value="General Resonance">General Resonance</option>
                <option value="Architecture & Spatial">Architecture & Spatial</option>
                <option value="Street Photography">Street Photography</option>
                <option value="Cinematography & Film">Cinematography & Film</option>
                <option value="Outdoor & Conservation">Outdoor & Conservation</option>
                <option value="Design & Typography">Design & Typography</option>
              </select>
            </div>

            <!-- Location Tag -->
            <div>
              <label class="auth-label" for="postLocation">Location (Optional)</label>
              <div class="input-group">
                <span class="input-prefix" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </span>
                <input type="text" id="postLocation" class="form-input has-prefix" placeholder="e.g. Kyoto, Japan or Berlin">
              </div>
            </div>

            <!-- Quick Hashtag Suggestions -->
            <div>
              <span style="font-size:0.78rem; color:var(--text-muted); display:block; margin-bottom:6px;">Suggested Tags (Click to append):</span>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">
                <button type="button" class="tag-chip" data-tag="#photography" style="font-size:0.75rem; background:var(--bg-secondary); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer; color:var(--text-secondary);">#photography</button>
                <button type="button" class="tag-chip" data-tag="#architecture" style="font-size:0.75rem; background:var(--bg-secondary); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer; color:var(--text-secondary);">#architecture</button>
                <button type="button" class="tag-chip" data-tag="#minimalism" style="font-size:0.75rem; background:var(--bg-secondary); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer; color:var(--text-secondary);">#minimalism</button>
                <button type="button" class="tag-chip" data-tag="#film" style="font-size:0.75rem; background:var(--bg-secondary); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer; color:var(--text-secondary);">#film</button>
                <button type="button" class="tag-chip" data-tag="#calm" style="font-size:0.75rem; background:var(--bg-secondary); border:1px solid var(--color-border); border-radius:var(--radius-full); padding:3px 10px; cursor:pointer; color:var(--text-secondary);">#calm</button>
              </div>
            </div>

            <!-- Publish Button -->
            <div style="margin-top:auto; padding-top:var(--space-4);">
              <button type="submit" id="submitPostBtn" class="btn btn-accent btn-lg" style="width:100%;">
                <span>Share Post to Feed</span>
                <svg class="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- Mobile Bottom Dock -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation">
    <a href="feed.html" class="dock-item" aria-label="Feed"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
    <a href="explore.html" class="dock-item" aria-label="Explore"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></a>
    <a href="create.html" class="dock-create-btn" aria-label="Create Post"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
    <a href="notifications.html" class="dock-item" aria-label="Notifications"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
    <a href="profile.html" class="dock-item" aria-label="Profile"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
  </nav>

  <script src="js/db.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
