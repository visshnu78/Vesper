<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesper: Explore & Discover</title>
  <meta name="description" content="Discover uncompressed photography and explore curated creator circles.">
  <link rel="canonical" href="https://vespersocial.org/explore.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-pages.css">
</head>
<body class="app-shell">

  <!-- Top Glass Navigation Bar -->
  <header class="app-nav-bar">
    <div class="app-nav-inner">
      <a href="feed.html" class="app-brand" aria-label="Back to Feed">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" style="width:26px; height:26px;" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.5"/>
          <path d="M10 21L16 9L22 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="17" r="2.5" fill="var(--accent-primary)"/>
        </svg>
        <span>Vesper</span>
        <span class="app-brand-badge">Explore</span>
      </a>

      <!-- Quick Search Bar -->
      <div class="app-nav-search" style="display:block; max-width:400px;">
        <span class="app-nav-search-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="exploreSearchInput" placeholder="Search creators, #tags, or keywords..." autocomplete="off">
      </div>

      <div class="app-nav-actions">
        <a href="feed.html" class="nav-icon-btn" title="Feed">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </a>
        <a href="messages.html" class="nav-icon-btn" title="Direct Messages">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </a>
        <a href="notifications.html" class="nav-icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </a>
        <a href="create.html" class="nav-icon-btn" title="Create Post" style="background:var(--accent-subtle); color:var(--accent-primary); border-color:var(--accent-border);">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </a>
        <button id="themeToggleBtn" class="nav-icon-btn" title="Toggle Theme" type="button">
          <svg id="themeMoonIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Explore Content -->
  <main class="explore-container">
    <!-- Category Filter Pills -->
    <div class="explore-filter-pills" role="tablist">
      <button class="category-pill active" data-category="all" type="button">All Media</button>
      <button class="category-pill" data-category="architecture" type="button">Architecture</button>
      <button class="category-pill" data-category="street" type="button">Street & Nocturnal</button>
      <button class="category-pill" data-category="film" type="button">35mm Analog Film</button>
      <button class="category-pill" data-category="nature" type="button">Wilderness & Nature</button>
      <button class="category-pill" data-category="minimalism" type="button">Minimalism</button>
    </div>

    <!-- Explore Grid -->
    <div class="media-3col-grid" id="exploreGrid" style="gap:var(--space-3);">
      <!-- Populated dynamically by js/explore.js -->
    </div>
  </main>

  <!-- Photo Lightbox Detail Modal -->
  <div id="exploreLightboxModal" class="lightbox-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="lightbox-content">
      <div class="lightbox-img-col">
        <img id="expLightboxImg" src="" alt="Full view">
      </div>
      <div class="lightbox-details-col">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--color-border); padding-bottom:var(--space-3); margin-bottom:var(--space-3);">
          <div style="display:flex; align-items:center; gap:10px;">
            <img id="expLightboxAuthorAvatar" src="" style="width:36px; height:36px; border-radius:50%; object-fit:cover;" alt="">
            <strong id="expLightboxAuthorUsername">@username</strong>
          </div>
          <button id="closeExpLightboxBtn" type="button" aria-label="Close lightbox" style="background:none; border:none; cursor:pointer; color:var(--text-muted); display:flex; align-items:center; justify-content:center;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <div id="expLightboxCaption" style="font-size:0.9rem; line-height:1.5; margin-bottom:var(--space-3); padding-bottom:var(--space-3); border-bottom:1px solid var(--color-border-subtle);"></div>

        <div id="expLightboxCommentsList" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:var(--space-2); margin-bottom:var(--space-3); font-size:0.86rem;"></div>

        <form id="expLightboxCommentForm" style="display:flex; gap:8px; border-top:1px solid var(--color-border); padding-top:var(--space-3);">
          <input type="text" id="expLightboxCommentInput" class="form-input" placeholder="Add a comment..." required style="height:38px; font-size:0.85rem;">
          <button type="submit" class="btn btn-primary btn-sm">Post</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Dock -->
  <nav class="mobile-bottom-dock" aria-label="Mobile Navigation">
    <a href="feed.html" class="dock-item" aria-label="Feed"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
    <a href="explore.html" class="dock-item active" aria-label="Explore"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></a>
    <a href="create.html" class="dock-create-btn" aria-label="Create Post"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
    <a href="notifications.html" class="dock-item" aria-label="Notifications"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></a>
    <a href="profile.html" class="dock-item" aria-label="Profile"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
  </nav>

  <script src="js/db.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
