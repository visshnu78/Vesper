<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesper: Sign In or Join Free</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="canonical" href="https://vespersocial.org/auth.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app-pages.css">
</head>
<body class="app-shell">
  <!-- Minimal Top Header -->
  <header class="app-nav-bar">
    <div class="app-nav-inner">
      <a href="index.html" class="app-brand">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" style="width:26px; height:26px;" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.5"/>
          <path d="M10 21L16 9L22 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="17" r="2.5" fill="var(--accent-primary)"/>
        </svg>
        <span>Vesper</span>
        <span class="app-brand-badge">Free Protocol</span>
      </a>

      <div class="app-nav-actions">
        <a href="feed.html" class="btn btn-outline btn-sm">Explore Feed</a>
        <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
          <svg id="themeMoonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Auth Center Card -->
  <main class="auth-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <h1 style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px;">
          Welcome to Vesper
        </h1>
        <p style="font-size: 0.88rem; color: var(--text-secondary);">
          Calm social media with chronological autonomy and 0% platform lock-in.
        </p>
      </div>

      <!-- Mode Switch Tabs -->
      <div class="auth-tabs-row" role="tablist">
        <button class="auth-tab-btn active" id="tabLoginBtn" type="button">Sign In</button>
        <button class="auth-tab-btn" id="tabRegisterBtn" type="button">Create Account</button>
      </div>

      <!-- Alert / Feedback Banner -->
      <div id="authAlert" style="display:none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: var(--space-4);"></div>

      <!-- 1. LOGIN FORM -->
      <form id="loginForm" novalidate>
        <div class="auth-form-group">
          <label class="auth-label" for="loginIdentifier">Username or Email</label>
          <input type="text" id="loginIdentifier" class="form-input" placeholder="e.g. elena_arch or elena@vesper.app" required autocomplete="username">
        </div>

        <div class="auth-form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: var(--space-1);">
            <label class="auth-label" for="loginPassword" style="margin-bottom:0;">Password</label>
            <span style="font-size:0.75rem; color:var(--text-muted);">Demo: password123</span>
          </div>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width: 100%; margin-top: var(--space-4);">
          <span>Sign In to Vesper</span>
          <svg class="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- 2. REGISTER FORM -->
      <form id="registerForm" style="display:none;" novalidate>
        <div class="auth-form-group">
          <label class="auth-label" for="regName">Your Display Name</label>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Maya Chen" required>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="regHandle">Desired Username Handle</label>
          <div class="input-group">
            <span class="input-prefix">@</span>
            <input type="text" id="regHandle" class="form-input has-prefix" placeholder="handle" required autocomplete="off">
          </div>
          <div id="regHandleFeedback" class="form-feedback" style="margin-top: 4px;"></div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-input" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="regPassword">Create Passphrase (min 8 characters)</label>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div class="auth-form-group">
          <label class="auth-label">Choose an Avatar</label>
          <div class="avatar-selector-grid" id="avatarSelector">
            <button type="button" class="avatar-choice-btn selected" data-avatar="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Avatar 1">
            </button>
            <button type="button" class="avatar-choice-btn" data-avatar="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80">
              <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80" alt="Avatar 2">
            </button>
            <button type="button" class="avatar-choice-btn" data-avatar="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80">
              <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80" alt="Avatar 3">
            </button>
            <button type="button" class="avatar-choice-btn" data-avatar="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80">
              <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80" alt="Avatar 4">
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width: 100%; margin-top: var(--space-4);">
          <span>Create Free Account</span>
          <svg class="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Fast Demo Switcher Strip -->
      <div class="demo-accounts-box">
        <div class="demo-accounts-title">Quick Demo Login (Pre-seeded Accounts)</div>
        <div class="demo-chip-group">
          <button type="button" class="demo-chip" data-demo-user="elena_arch">@elena_arch</button>
          <button type="button" class="demo-chip" data-demo-user="marcus_lens">@marcus_lens</button>
          <button type="button" class="demo-chip" data-demo-user="maya_film">@maya_film</button>
          <button type="button" class="demo-chip" data-demo-user="dr_julian">@dr_julian</button>
        </div>
      </div>

      <div style="text-align:center; margin-top:var(--space-4); font-size:0.75rem; color:var(--text-muted); display:flex; justify-content:center; gap:var(--space-3);">
        <a href="privacy.html" style="color:var(--text-secondary); text-decoration:none;">Privacy Policy</a>
        <span>·</span>
        <a href="terms.html" style="color:var(--text-secondary); text-decoration:none;">Terms of Service</a>
      </div>
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
